[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funding-registry"
version = "0.4.0"
description = "Portable public funding registry for Finnish municipalities"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf>=6,<7",
  "fonttools>=4,<5",
]

[project.optional-dependencies]
azure = ["pyodbc>=5.2,<6", "azure-identity>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "openpyxl>=3.1,<4"]

[project.scripts]
funding = "funding.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/funding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
